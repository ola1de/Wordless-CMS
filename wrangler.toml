# WORDLESS — Cloudflare Workers configuration (Milestone 3).
# No secrets in this file. D1/KV ids are placeholders until the user
# connects a Cloudflare account (see README.md). Run `wrangler login`
# and `wrangler d1 create wordless` / `wrangler kv namespace create CONFIG`
# then replace the REPLACE-ME values below.

name = "wordless"
main = "src/index.ts"
# Compatibility date: 2026-11-18 (not 2026-11-19) because Wrangler rejects a
# date in the future relative to the machine clock, and this was authored
# while the system clock was still 2026-11-18 UTC. Safe to bump forward
# once that date has passed everywhere; behaviour is identical for M1.
compatibility_date = "2026-11-18"

# Admin SPA (React, Vite build to admin/dist/admin/). Static Assets are
# served under /admin by the Worker via the ASSETS binding (src/index.ts);
# the Worker keeps priority for /api/* and the public site. The `binding`
# line is required: without it no ASSETS fetcher is injected into the
# Worker and every non-file /admin/* path (SPA deep links, refreshes)
# would return 503 "Admin build not found" even though /admin/ itself
# still loads (the platform serves exact files directly).
[assets]
binding = "ASSETS"
directory = "./admin/dist"

[[d1_databases]]
binding = "DB"
database_name = "wordless"
database_id = "REPLACE-ME"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wordless-media"

[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE-ME"

# AI (Milestone 6) — Workers AI is the DEFAULT and only required provider.
# It needs no API key, only this binding. It is COMMENTED OUT because no
# Cloudflare account is connected yet: uncomment it when deploying to
# Cloudflare (wrangler login first), and the code handles the binding
# being absent by reporting "Workers AI is not configured" — it never
# crashes. Local development and tests use the mock provider instead
# (select it in the AI command centre, or leave the default: tasks that
# need a provider fail honestly until the binding exists).
# [ai]
# binding = "AI"

# OpenAI-compatible provider (OPTIONAL fallback only): no wrangler.toml
# entry is needed. If you prefer it, set the secret on the deployed
# Worker with `wrangler secret put OPENAI_API_KEY` (never in this file),
# optionally OPENAI_BASE_URL / OPENAI_MODEL. Without the secret the
# provider reports "not configured".

# Image derivatives (Milestone 9) — Cloudflare Images binding.
# OPTIONAL and COMMENTED OUT because no Cloudflare account is connected
# yet: uncomment it when deploying to Cloudflare (wrangler login first).
# Images is a paid add-on on some plans — check the Cloudflare Images
# pricing before enabling. Without the binding the media endpoint serves
# originals and the admin media page reports derivatives as unavailable.
# [images]
# binding = "IMAGES"

# Integrations + commerce (Milestone 8) — secrets only, no wrangler.toml
# entries needed. Set them on the deployed Worker with `wrangler secret
# put <NAME>` (never in this file, never in code, never in D1):
#   PAYSTACK_SECRET_KEY, FLUTTERWAVE_SECRET_KEY, FLUTTERWAVE_SECRET_HASH,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, EMAIL_API_KEY (with the
#   EMAIL_API_URL non-secret setting from the Integrations page),
#   MOCK_PAYMENT_WEBHOOK_SECRET (test-mode mock webhooks only).
# Local development: put the same names in `.dev.vars` (git-ignored).
# Without them the providers report "not configured" and checkout
# refuses with a 503 — it never fakes a successful payment.

# Environments (Milestone 10) — staging and production are separate
# Workers with separate D1 databases and R2 buckets. Production NEVER
# shares the dev database or bucket names. Deploy with:
#   npm run deploy:staging      (tests + build + checks, then deploy --env staging)
#   npm run deploy:production   (tests + build + checks, then deploy --env production)
# Promotion path: dev → staging → production (see DEPLOYMENT.md).
# The installer provisions the production resources (wordless-prod /
# wordless-media-prod) when you choose the production path; the ids land
# in the [env.production] blocks below. Until then the REPLACE-ME
# placeholders are expected — local development uses the top-level
# bindings and never touches staging or production.

[env.staging]
name = "wordless-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "wordless-staging"
database_id = "REPLACE-ME"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "wordless-media-staging"

[[env.staging.kv_namespaces]]
binding = "CONFIG"
id = "REPLACE-ME"

# [env.staging.ai]
# binding = "AI"

[env.production]
name = "wordless-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "wordless-prod"
database_id = "REPLACE-ME"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "wordless-media-prod"

[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "REPLACE-ME"

# [env.production.ai]
# binding = "AI"
